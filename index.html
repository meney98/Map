<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Fonadhoo Map</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#fff}#bar{position:fixed;z-index:2;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center}#search{flex:1;max-width:420px;padding:10px 12px;border:1px solid #333;border-radius:8px;background:white}button{padding:10px 14px;border:1px solid #333;border-radius:8px;background:white}#viewport{width:100%;height:100%;overflow:hidden;touch-action:none;cursor:grab}#map{width:100%;height:100%;object-fit:contain;transform-origin:0 0;user-select:none;pointer-events:none}</style></head><body><div id='bar'><input id='search' placeholder='Search house name'><button id='reset'>Reset</button></div><div id='viewport'><img id='map' src='map.svg' alt='Fonadhoo map'></div><script src='script.js'></script></body></html>
