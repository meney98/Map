<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fonadhoo Map</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#fff;overflow:hidden}
#bar{position:fixed;z-index:20;top:10px;left:10px;right:10px;display:flex;gap:7px;align-items:center}
#search{flex:1;min-width:0;max-width:430px;padding:11px 12px;font-size:16px;border:1px solid #333;border-radius:9px;background:#fff}
button{min-height:44px;padding:9px 12px;border:1px solid #333;border-radius:9px;background:#fff;font-size:14px}
#results{position:fixed;z-index:25;top:58px;left:10px;width:min(430px,calc(100% - 20px));max-height:42vh;overflow:auto;background:white;border:1px solid #bbb;border-radius:9px;display:none}
.result{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;border-radius:0;padding:11px 12px;background:#fff}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#fff}
#stage{position:absolute;left:0;top:0;width:14400px;height:11883px;transform-origin:0 0}
#map{position:absolute;inset:0;width:14400px;height:11883px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hit{position:absolute;border:0;background:transparent;padding:0;min-height:0;border-radius:0;cursor:pointer}
.hit.selected{outline:10px solid #e60000;background:rgba(255,0,0,.18)}
#card{position:fixed;z-index:30;left:10px;right:10px;bottom:10px;max-width:440px;margin:auto;background:#fff;border:1px solid #333;border-radius:12px;padding:14px;display:none;box-shadow:0 2px 12px #0003}
#card h3{margin:0 36px 10px 0;font-size:18px}.row{font-size:14px;margin:5px 0}.muted{color:#666}
#close{position:absolute;right:8px;top:8px;border:0;min-height:36px;padding:5px 10px;font-size:20px}
</style></head>
<body>
<div id="bar"><input id="search" autocomplete="off" placeholder="Search house name"><button id="reset">Reset</button></div>
<div id="results"></div>
<div id="viewport"><div id="stage"><img id="map" src="map.svg" alt="Fonadhoo map"><div id="hits"></div></div></div>
<div id="card"><button id="close" aria-label="Close">×</button><h3 id="houseName"></h3>
<div class="row"><b>House number:</b> <span class="muted">—</span></div>
<div class="row"><b>Area / SS:</b> <span class="muted">—</span></div>
<div class="row"><b>Feeder number:</b> <span class="muted">—</span></div>
<div class="row"><b>Distribution box:</b> <span class="muted">—</span></div>
<div class="row"><b>Breaker number:</b> <span class="muted">—</span></div>
<div class="row"><b>Meter number:</b> <span class="muted">—</span></div></div>
<script src="data.js"></script><script src="script.js"></script></body></html>
